<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">手接權重（handwired）行為分析：一層「特徵 × 權重 + 偏差 → ReLU」</text>

  <!-- column titles -->
  <text x="130" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#2457a7">① 特徵（0～1）</text>
  <text x="440" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#2457a7">② 手寫權重 W ＋ 偏差 b</text>
  <text x="755" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#2457a7">③ ReLU → 樣態分數</text>

  <!-- features -->
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="92" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="114" text-anchor="middle">第一次求助前沒動手 0.9</text>
    <rect x="30" y="136" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="158" text-anchor="middle">求助間只照做少量接上 1.0</text>
    <rect x="30" y="180" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="202" text-anchor="middle">放的正是 AI 提到的積木 1.0</text>
    <rect x="30" y="224" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="246" text-anchor="middle">求助次數（÷5）1.0</text>
    <rect x="30" y="268" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="290" text-anchor="middle">拉開＋刪除比例 0.0</text>
    <rect x="30" y="312" width="200" height="34" rx="6" fill="#eef4ff" stroke="#9db7e6"/><text x="130" y="334" text-anchor="middle">動手前讀題時間 0.1</text>
    <text x="130" y="370" text-anchor="middle" font-size="12" fill="#6b7280">……共 18 個特徵</text>
  </g>

  <!-- connection lines to the weight box -->
  <g stroke="#9db7e6" stroke-width="1.5">
    <line x1="230" y1="109" x2="300" y2="200"/><line x1="230" y1="153" x2="300" y2="205"/>
    <line x1="230" y1="197" x2="300" y2="210"/><line x1="230" y1="241" x2="300" y2="215"/>
    <line x1="230" y1="285" x2="300" y2="220"/><line x1="230" y1="329" x2="300" y2="225"/>
  </g>

  <!-- weight box -->
  <rect x="300" y="92" width="280" height="254" rx="10" fill="#fffbea" stroke="#e0a800" stroke-width="1.5"/>
  <text x="440" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">例：「照著 AI 做」這一列</text>
  <g font-size="13" fill="#1f2937" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="320" y="146">  0.5 × 0.9  = 0.45</text>
    <text x="320" y="168">  1.0 × 1.0  = 1.00</text>
    <text x="320" y="190">  0.6 × 1.0  = 0.60</text>
    <text x="320" y="212">  0.6 × 1.0  = 0.60</text>
    <text x="320" y="234">−0.8 × 0.0  = 0.00</text>
    <text x="320" y="256">  ……</text>
    <text x="320" y="282">偏差 b       = −0.90</text>
    <line x1="320" y1="292" x2="560" y2="292" stroke="#e0a800"/>
    <text x="320" y="316" font-weight="700">合計         = 1.75</text>
  </g>
  <text x="440" y="336" text-anchor="middle" font-size="11" fill="#6b7280">正權重＝支持這個樣態，負權重＝反對</text>

  <!-- arrow to relu -->
  <line x1="580" y1="219" x2="625" y2="219" stroke="#2457a7" stroke-width="2"/>
  <polygon points="625,213 637,219 625,225" fill="#2457a7"/>

  <!-- relu and outputs -->
  <rect x="640" y="190" width="70" height="58" rx="8" fill="#2457a7"/>
  <text x="675" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ReLU</text>
  <text x="675" y="236" text-anchor="middle" font-size="11" fill="#dbe7ff">max(0, x)</text>
  <line x1="710" y1="219" x2="730" y2="219" stroke="#2457a7" stroke-width="2"/>

  <g font-size="13">
    <rect x="730" y="100" width="130" height="30" rx="6" fill="#fde2e1" stroke="#e57373"/><text x="795" y="120" text-anchor="middle" fill="#7f1d1d" font-weight="700">照著 AI 做 1.75 ✔</text>
    <rect x="730" y="140" width="130" height="30" rx="6" fill="#fde2e1" stroke="#e57373"/><text x="795" y="160" text-anchor="middle" fill="#7f1d1d">沒讀題就動手 0.70 ✔</text>
    <rect x="730" y="180" width="130" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="795" y="200" text-anchor="middle" fill="#6b7280">反覆試錯 0</text>
    <rect x="730" y="220" width="130" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="795" y="240" text-anchor="middle" fill="#6b7280">盲目送評分 0</text>
    <rect x="730" y="260" width="130" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="795" y="280" text-anchor="middle" fill="#6b7280">穩定組合 0</text>
    <text x="795" y="312" text-anchor="middle" font-size="12" fill="#6b7280">……共 10 種樣態</text>
    <text x="795" y="334" text-anchor="middle" font-size="12" fill="#6b7280">≥ 0.3 才列給老師</text>
  </g>

  <!-- bottom notes -->
  <rect x="30" y="392" width="820" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="13" fill="#374151">
    <text x="50" y="416">✔ 不用 AI 金鑰、不用訓練資料：權重是老師的判斷規則直接寫成數字，在教室電腦本機就能算。</text>
    <text x="50" y="440">✔ 看得懂：每個分數都能拆回「哪個特徵貢獻多少」當證據；之後也能用老師的標註以梯度下降微調。</text>
  </g>
</svg>
